spring:
  application:
    name: dalmoi

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dalmoi_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:local-password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 100

  flyway:
    validate-migration-naming: true

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  connect-timeout: 2s
  timeout: 2s

logging:
  level:
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}

dalmoi:
  record:
    worker-enabled: ${RECORD_WORKER_ENABLED:true}
  auth:
    secret: ${JWT_SECRET:}
    issuer: dalmoi
    access-ttl: ${ACCESS_TOKEN_TTL:30m}
    refresh-ttl: ${REFRESH_TOKEN_TTL:14d}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  paths-to-match: /api/v1/**
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    disable-swagger-default-url: true
    tags-sorter: alpha
    operations-sorter: method
