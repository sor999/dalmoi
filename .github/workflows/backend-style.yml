name: Backend style

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Java formatting and style
        working-directory: backend
        run: ./gradlew --no-daemon spotlessCheck checkstyleMain checkstyleTest
      - name: Test formatter readability
        run: python3 backend/scripts/test-formatter.py
      - name: Test agent Stop hook
        run: python3 .codex/hooks/test_check_style.py
